name: AI Eval

# Runs the golden-set evals (Section 15.1):
#  - on PRs labelled "ai-change" (any prompt, model, chunking or retrieval change)
#  - nightly
#  - manually
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "30 20 * * *" # 02:00 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ai-change')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      LLM_MODEL_ID: ${{ vars.LLM_MODEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Extraction eval
        working-directory: backend
        run: uv run python ../eval/run_extraction_eval.py

      - name: Answer eval
        working-directory: backend
        run: uv run python ../eval/run_answer_eval.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: eval/results/
          if-no-files-found: ignore
